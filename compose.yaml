name: central-solicitacoes

services:
    mysql:
        image: mysql:8.4
        ports:
            - "127.0.0.1:${DB_PORT:-3307}:3306"
        environment:
            MYSQL_DATABASE: central_solicitacoes
            MYSQL_USER: central
            MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h127.0.0.1 -ucentral central_solicitacoes --execute="SELECT 1" > /dev/null']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

volumes:
    mysql-data:
